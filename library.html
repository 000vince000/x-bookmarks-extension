<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>X Bookmarks Library</title>
    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <header>
      <h1>Bookmarks Library</h1>
      <div id="count"></div>
    </header>
    <div id="controls">
      <input id="search" type="text" placeholder="Search text or author…" />
      <select id="authorFilter"><option value="">All authors</option></select>
      <select id="tagFilter"><option value="">All tags</option></select>
      <label><input type="checkbox" id="mediaOnly" /> Media only</label>
    </div>
    <div id="list"></div>
    <script type="module" src="library.js"></script>
  </body>
</html>
