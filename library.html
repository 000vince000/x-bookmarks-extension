<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>X Bookmarks Library</title>
    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <header>
      <h1>Bookmarks Library</h1>
      <div id="count"></div>
      <div id="sessionStats"></div>
    </header>
    <div id="controls">
      <input id="search" type="text" placeholder="Search text or author…" />
      <select id="authorFilter"><option value="">All authors</option></select>
      <select id="tagFilter"><option value="">All tags</option></select>
      <div id="typeFilter" class="type-filter">
        <label><input type="checkbox" id="filterImage" /> Image</label>
        <label><input type="checkbox" id="filterVideo" /> Video</label>
        <label><input type="checkbox" id="filterArticle" /> X Article</label>
        <label><input type="checkbox" id="filterLink" /> Link</label>
      </div>
    </div>
    <div id="embedControls">
      <span id="embedStatus"></span>
      <button id="embedBtn">Compute embeddings</button>
      <label>Groups <input id="clusterK" type="number" min="2" max="60" value="35" title="Number of groups" /></label>
      <label>Related threshold <input id="relatedMinScore" type="number" min="0" max="1" step="0.05" value="0.3" title="Minimum similarity score to show as Related" /></label>
      <span class="control-divider"></span>
      <span id="ownTweetStatus"></span>
      <button id="ownTweetEmbedBtn">Compute own-tweet embeddings</button>
      <label class="import-btn" for="importOwnTweetsInput">Import from X archive (tweets.js)</label>
      <input type="file" id="importOwnTweetsInput" accept=".js" multiple hidden />
    </div>
    <div id="browse">
      <nav id="sidebar"></nav>
      <div id="main">
        <div id="list"></div>
      </div>
    </div>
    <script type="module" src="library.js"></script>
  </body>
</html>
